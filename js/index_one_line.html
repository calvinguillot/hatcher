<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Line Plotter Art</title>

    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        font-family: 'Courier New', monospace;
      }
      #canvas-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }
      #canvas-container > .dg {
        position: fixed !important;
        top: 10px !important;
        right: 10px !important;
        z-index: 100 !important;
      }
      .info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: #666;
        font-size: 12px;
      }
    </style>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  </head>

  <body>
    <div id="canvas-container"></div>
    <div class="info">Drop an image to load | Press 'S' to save SVG | Press 'P' to save PNG</div>
    <script src="sketch_one_line_opus.js"></script>
  </body>
</html>
